name: Preview12 immutable Slim qualification

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [off, qualify]
        default: off

permissions:
  contents: read
  actions: read

concurrency:
  group: preview12-slim-qualification
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.policy.outputs.armed }}
      controller: ${{ steps.policy.outputs.controller }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: policy
        env:
          PHASE: ${{ inputs.phase || 'off' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          data = json.load(open('docs/preview12-slim-recovery.json'))
          armed = data.get('armed') is True and os.environ['PHASE'] == 'qualify'
          controller = data.get('controllerSource') if armed else ''
          if armed and not re.fullmatch('[0-9a-f]{40}', controller or ''):
              raise ValueError('Exact reviewed controller is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'armed={str(armed).lower()}\ncontroller={controller}\n')
          PY

  qualify:
    name: qualify-slim-preview12
    needs: admission
    if: ${{ needs.admission.outputs.armed == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: policy-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.controller }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d31c3631ed4bbe6520f7f5f7c7e7d34499c38122
          path: product
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Qualify original native artifacts and canonical managed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B -I controller/scripts/recover_preview12_slim.py qualify
          --policy policy-source/docs/preview12-slim-recovery.json
          --product-root product --output "${{ runner.temp }}/preview12-slim-qualified"
      - name: Retain every actual qualification outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-preview12-slim
          path: |
            ${{ runner.temp }}/preview12-slim-qualified/*.json
            ${{ runner.temp }}/preview12-slim-qualified/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the seven unsigned phase packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-preview12-slim-recovered
          path: ${{ runner.temp }}/preview12-slim-qualified/packages/*.nupkg
          if-no-files-found: warn
          retention-days: 14
