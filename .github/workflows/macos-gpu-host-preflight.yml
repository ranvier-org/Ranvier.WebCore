name: Private Cocoa GPU Host compile preflight

on:
  push:
    branches: [codex/project2-macos220-host-headers]

permissions:
  contents: read

jobs:
  host-objects:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select actual SDK and generator tools
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for tool in cmake ninja gperf; do command -v "$tool" >/dev/null || brew install "$tool"; done
      - name: Generate headers and compile only seven actual GPU Host objects
        run: python3 -I tests/gpu/mac/host_preflight.py --work "$RUNNER_TEMP/ranvier-mac220-host-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-cocoa-gpu-host-preflight
          path: ${{ runner.temp }}/ranvier-mac220-host-preflight/host-preflight
          if-no-files-found: error
