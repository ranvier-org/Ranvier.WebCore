# Builds the native package for each runtime in the matrix (docs/CI.md). A manual run can build a subset.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        type: choice
        options: [slim, gpu, lean]
        default: slim
      rids:
        description: Runtime identifiers to build, comma-separated (empty for all)
        type: string
        default: ''
      clean:
        description: Build from scratch, without restoring the cached build tree
        type: boolean
        default: false

concurrency:
  group: ${{ format('{0}-{1}-{2}-{3}', github.workflow, github.ref, inputs.flavor || 'slim', inputs.rids || 'all') }}
  cancel-in-progress: true

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -I tests/test_public_cocoa_replay.py
      - run: python -I tests/test_public_cocoa_replay_workflow.py
      - run: python -I tests/atspi/test_arm64_managed.py
      - run: python -I tests/atspi/test_runtime_admission.py
      - run: python -I tests/atspi/test_prepared_managed.py
      - run: python -I tests/test_package_contract.py
      - run: python -I tests/test_release.py
      - run: python -I tests/test_publish_gate.py
      - run: python -I tests/test_probes.py
      - run: python -I tests/gpu/egl_consumer_fence.py
      - run: python -I tests/test_abi_cohort_entry.py
      - run: python -I tests/test_abi_driver_workspace.py
      - run: python -I tests/abi/test_abi_expectation.py
      - run: python -I tests/gpu/test_linux_transition_abi.py
      - run: python -I tests/atspi/test_distribution.py
      - run: python -I tests/atspi/test_release.py
      - run: python -I tests/atspi/test_sdk_consumer.py
      - run: python -I tests/test_native_media.py
      - run: python -I tests/test_background_clip_policy.py
      - run: python -I tests/test_producer_gpu_clipping.py
      - run: python -I tests/test_native_media_packages.py
      - run: python -I tests/test_sdl_runtime.py
      - run: python -I tests/test_package_gpu.py
      - run: python -I tests/test_sccache_cache_policy.py
      - run: python -I tests/test_build_sccache_launcher.py
      - run: python -I tests/test_sccache_workflow.py
      - run: python -I tests/test_cache_scope.py
      - run: python -I tests/test_tree_artifacts.py
      - run: python -I tests/test_host_prepare.py
      - run: python -I tests/test_mutation_contract.py
      - run: python -I tests/test_mutation_routing.py
      - run: python -I tests/generator/test_domgen.py
      - run: python -I scripts/capability_catalogue.py --check
      - run: python -I tests/abi/generate_native.py check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore multi-RID packages and verify resource layout
        run: python -I tests/test_resource_packages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Portable tools precede RID-specific tools in the manifest to avoid SDK cold-cache command
      # misattribution (https://github.com/dotnet/sdk/issues/53783).
      - run: dotnet tool restore
      - name: Compile the full shared contracts on .NET
        run: dotnet build tests/generator/Contracts.fsproj -c Release
      - name: Verify the managed catalogue ABI cohort admission
        run: dotnet run --project tests/abi/cohort/Checks.fsproj -c Release
      - name: Compile and execute inherited DOM member implementations
        run: |
          python -I tests/generator/write_inherited_fixture.py artifacts/inherited-fixture
          dotnet run --project artifacts/inherited-fixture/Fixture.fsproj -c Release
      - name: Check the generated F# layout
        run: dotnet fantomas --check gen/Ranvier.Dom.fs
      - name: Compile and execute the browser union adapters
        run: |
          python -I tests/generator/write_fable_fixture.py artifacts/dom-fixture
          dotnet fickl artifacts/dom-fixture/Fixture.fsproj --outDir artifacts/dom-fixture/js
          node artifacts/dom-fixture/js/Program.js
      - name: Compile and execute the full generated browser contracts
        run: |
          dotnet fickl tests/generator/browser/FullBrowser.fsproj --outDir artifacts/full-browser/js --noCache --extension .js
          node artifacts/full-browser/js/FullBrowser.js
      - name: Verify named getters against actual Chromium DOM objects
        run: |
          dotnet fickl tests/generator/browser/NamedLookupBrowser.fsproj --outDir artifacts/named-lookup/js --noCache --extension .js
          python -I tests/generator/browser/run_named_lookup.py --browser "$(command -v google-chrome)" --output artifacts/named-lookup/js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-lookup-browser-proof
          path: artifacts/named-lookup/js/named-lookup-*.html
          if-no-files-found: ignore

  plan:
    # The matrix of runtime and flavor cells, filtered by the manual run's rids input. A version tag push builds
    # the Slim runtimes and the GPU runtimes side by side, so one publish releases both flavors. On a version tag
    # whose release holds a cell's package, attached by scripts/release.py as the repository owner, that cell goes
    # to prebuilt instead.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prebuilt: ${{ steps.plan.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pins.json
          sparse-checkout-cone-mode: false
      - id: plan
        shell: python
        env:
          RIDS: ${{ inputs.rids }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-matrix') }}
          FLAVOR: ${{ inputs.flavor || 'slim' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.error, urllib.request
          # A WebKit build needs about 10 GB of disk and runs for hours on the standard runners.
          runtimes = [
              # work: a short root on Windows, where WebKit's generated paths exceed MAX_PATH under the
              # default workspace.
              dict(rid='win-x64', runner='windows-2025', work='C:\\rw'),
              dict(rid='win-arm64', runner='windows-11-arm', work='C:\\rw'),
              dict(rid='linux-x64', runner='ubuntu-24.04', work='/mnt/rw'),
              dict(rid='linux-arm64', runner='ubuntu-24.04-arm', work='/mnt/rw'),
              # macOS runners have one volume; the home directory is on its data volume. macos-26, because the
              # newest Xcode on macos-15 (26.3) cannot build WebKit's Swift sources (docs/CI.md).
              dict(rid='osx-arm64', runner='macos-26', work='/Users/runner/rw'),
          ]
          wanted = [r.strip() for r in os.environ.get('RIDS', '').split(',') if r.strip()]
          # A pull request builds win-x64 only, unless it is a batch branch or carries the full-matrix label.
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and not os.environ['HEAD_REF'].startswith('codex/batch-') \
                  and os.environ['FULL_LABEL'] != 'true':
              wanted = ['win-x64']
          include = [r for r in runtimes if not wanted or r['rid'] in wanted]
          if not include:
              raise SystemExit(f'no runtime matches {wanted}')
          # Windows ARM64 has no GPU build; the GPU aggregate takes its Slim package (scripts/package_managed.py).
          gpu_rids = ('win-x64', 'linux-x64', 'linux-arm64', 'osx-arm64')
          cells = [dict(r, flavor=os.environ['FLAVOR']) for r in include]
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'].startswith('refs/tags/v'):
              cells += [dict(r, flavor='gpu') for r in include if r['rid'] in gpu_rids]
          prebuilt = []
          ref, owner = os.environ['GITHUB_REF'], os.environ['GITHUB_REPOSITORY_OWNER']
          if ref.startswith('refs/tags/v'):
              tag = ref.removeprefix('refs/tags/')
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}",
                  headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
              try:
                  release = json.load(urllib.request.urlopen(request, timeout=60))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  release = None
              # Only the owner's: anyone who can push a tag could otherwise attach a package to be published.
              assets = {a['name'] for a in release['assets'] if a['uploader']['login'] == owner} \
                  if release and release['author']['login'] == owner else set()
              base = json.load(open('pins.json'))['package']['id']
              for cell in cells:
                  name = f"{base}{ {'slim': '.Cpu', 'gpu': '', 'lean': '.Lean'}[cell['flavor']] }.{cell['rid']}.{tag[1:]}.nupkg"
                  if name in assets:
                      prebuilt.append(dict(cell, asset=name))
          done = {(p['rid'], p['flavor']) for p in prebuilt}
          build = [c for c in cells if (c['rid'], c['flavor']) not in done]
          print('build:', *(f"{c['rid']}/{c['flavor']}" for c in build), '- prebuilt:', *(f"{p['rid']}/{p['flavor']}" for p in prebuilt))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              # An empty string for an empty list, which the jobs' conditions test.
              out.write('matrix=' + (json.dumps(dict(include=build)) if build else '') + '\n')
              out.write('prebuilt=' + (json.dumps(dict(include=prebuilt)) if prebuilt else '') + '\n')

  prebuilt:
    # A runtime whose package was built and checked on the owner's machine by scripts/release.py: checked
    # again here, on a clean runner of its platform, against the tag's commit, then passed to publish.
    needs: plan
    if: ${{ needs.plan.outputs.prebuilt != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prebuilt) }}
    runs-on: ${{ matrix.runner }}
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download the package from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '${{ matrix.asset }}' --dir packages

      - name: Check the package and paint a page
        shell: bash
        run: >-
          python scripts/smoke.py --package 'packages/${{ matrix.asset }}' --expect-commit "$GITHUB_SHA"
          --expect-version "${GITHUB_REF_NAME#v}" --expect-flavor "$FLAVOR"
          ${{ startsWith(matrix.rid, 'linux') && '--no-load' || '' }}

      - name: Verify packaged CSS queries, computed styles and fragment rectangles
        if: env.FLAVOR == 'slim'
        shell: bash
        run: python -I scripts/check_package_api.py --package 'packages/${{ matrix.asset }}'

      - name: Select macOS packaged GPU consumer tools
        if: env.FLAVOR == 'gpu' && matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v pkg-config >/dev/null || brew install pkg-config

      - name: Verify packaged GPU shared frames and lifetimes
        if: env.FLAVOR == 'gpu' && (matrix.rid == 'win-x64' || startsWith(matrix.rid, 'linux-') || matrix.rid == 'osx-arm64')
        shell: bash
        run: python -I scripts/check_package_api.py --gpu --package 'packages/${{ matrix.asset }}' --evidence '${{ runner.temp }}/mac-gpu-public-qualification'

      - name: Retain packaged macOS texture qualification
        if: always() && env.FLAVOR == 'gpu' && matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-mac-gpu-public-qualification
          path: ${{ runner.temp }}/mac-gpu-public-qualification
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: packages/*.nupkg

  native:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && matrix.rid == 'win-x64' && 'build-sccache-main-writer' || format('native-{0}-{1}-{2}', github.run_id, matrix.rid, matrix.flavor) }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Deleting the build tree a run has superseded (docs/CI.md, "Build tree").
      actions: write
    env:
      FLAVOR: ${{ matrix.flavor }}
      RANVIER_WORK: ${{ matrix.work }}
      BUILD_DIR: ${{ matrix.work }}/build-${{ matrix.flavor }}
      # The build tree is restored on every run but a clean one, and saved where later runs can restore it: a
      # branch's runs see its own entries and the default branch's, a pull request's its own and its base's, a tag
      # only the default branch's.
      TREE_RESTORE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean) }}
      TREE_SAVE: >-
        ${{ (github.event_name != 'pull_request' &&
             (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/batch-'))) ||
            (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/batch-')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify optional sccache fallback
        if: runner.os == 'Windows' && matrix.rid == 'win-x64'
        run: python -I tests/test_sccache_powershell.py

      - name: Verify sccache launcher cache fallback
        if: runner.os == 'Windows' && matrix.rid == 'win-x64'
        run: python -I tests/test_build_sccache_launcher.py

      # The F# ABI tests of the smoke step target .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore gperf
        id: gperf
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\tools\gperf
          key: gperf-3.1.0-${{ matrix.rid }}

      - name: Install gperf
        if: runner.os == 'Windows' && steps.gperf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Chocolatey's feed fails transiently: 503 and 504 on 2026-10-27.
          for ($attempt = 1; ; $attempt++) {
            choco install gperf --version 3.1.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { exit 1 }
            Start-Sleep (30 * $attempt)
          }
          New-Item -ItemType Directory -Force C:\rw\tools\gperf | Out-Null
          Copy-Item C:\ProgramData\chocolatey\lib\gperf\tools\* C:\rw\tools\gperf -Recurse -Exclude *.zip

      - name: Save gperf
        if: ${{ !startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && steps.gperf.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: C:\rw\tools\gperf
          key: gperf-3.1.0-${{ matrix.rid }}

      - name: Put gperf on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:\rw\tools\gperf -Recurse -Filter gperf.exe | Select-Object -First 1
          if (-not $exe) { throw 'no gperf.exe under C:\rw\tools\gperf' }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName

      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          # Acquire::Retries retries a download that fails at the mirror.
          sudo apt-get -o Acquire::Retries=5 update -q
          grep -v '^#' scripts/linux-packages.txt | xargs sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends
          sudo mkdir -p "$RANVIER_WORK" && sudo chown "$USER" "$RANVIER_WORK"

      - name: Install the macOS tools
        if: runner.os == 'macOS'
        run: |
          # WebKit's Mac port builds Swift sources that need a recent Xcode: the newest released Xcode 26.
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          # No auto-update: it fetches Homebrew's taps, which installing a bottle does not need.
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for tool in gperf ninja cmake pkg-config; do
            command -v $tool >/dev/null && continue
            for attempt in 1 2 3 4; do
              brew install $tool && break
              [ $attempt = 4 ] && exit 1
              sleep $((30 * attempt))
            done
          done
          mkdir -p "$RANVIER_WORK"

      - name: Tool versions and disk
        shell: pwsh
        run: |
          python --version; perl -v | Select-Object -Skip 1 -First 1; ruby -v; gperf --version | Select-Object -First 1
          cmake --version | Select-Object -First 1; dotnet --version
          if ($IsWindows) {
            $env:VCPKG_DOWNLOADS = "$env:RANVIER_WORK\vcpkg-downloads"
            New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS, "$env:RANVIER_WORK\vcpkg-archives" | Out-Null
            Add-Content $env:GITHUB_ENV "VCPKG_DOWNLOADS=$env:VCPKG_DOWNLOADS"
            Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$env:RANVIER_WORK\vcpkg-archives,readwrite"
          } else {
            clang --version | Select-Object -First 1
            df -h $env:RANVIER_WORK
          }

      # Each downloaded dependency has its own cache, restored before it is needed and saved as soon as it is
      # fetched, so a later failure does not discard it and a package host's outage only matters on a miss. The
      # keys name the toolchain, so this step follows the tool installs (scripts/build_cache.py keys, docs/CI.md).
      - name: Cache keys
        id: keys
        run: python -I scripts/build_cache.py keys --rid ${{ matrix.rid }} --flavor ${{ env.FLAVOR }}

      - name: Restore LLVM
        id: llvm
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\tools\llvm
          key: ${{ steps.keys.outputs.llvm }}

      - name: Package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "RANVIER_PACKAGE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))"

      - name: Fetch WebKit (and on Windows vcpkg and LLVM)
        run: python scripts/build.py fetch --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Save LLVM
        if: ${{ !startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' && steps.llvm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: C:\rw\tools\llvm
          key: ${{ steps.keys.outputs.llvm }}

      - name: Install and configure sccache
        id: sccache-install
        if: runner.os == 'Windows' && matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $installed = $false
          try {
            python -I scripts/sccache_cache_policy.py install --out C:\rw\tools\sccache
            if ($LASTEXITCODE -eq 0) {
              & C:\rw\tools\sccache\sccache.exe --version
              $installed = $LASTEXITCODE -eq 0
            }
          } catch {
            Write-Warning 'Pinned sccache installation failed; continuing with the direct compiler.'
          }
          if ($installed) {
            New-Item -ItemType Directory -Force C:\rw\sccache-cache | Out-Null
            Add-Content $env:GITHUB_PATH 'C:\rw\tools\sccache'
            Add-Content $env:GITHUB_ENV 'RANVIER_SCCACHE=C:\rw\tools\sccache\sccache.exe'
            Add-Content $env:GITHUB_ENV 'SCCACHE_DIR=C:\rw\sccache-cache'
            Add-Content $env:GITHUB_ENV 'SCCACHE_CACHE_SIZE=192M'
            Add-Content $env:GITHUB_OUTPUT 'available=true'
          } else {
            Write-Warning 'Pinned sccache could not be installed; continuing with the direct compiler.'
            Add-Content $env:GITHUB_OUTPUT 'available=false'
            $global:LASTEXITCODE = 0
          }

      - name: Set sccache weekly key
        id: sccache-key
        if: steps.sccache-install.outputs.available == 'true'
        shell: pwsh
        run: python -I scripts/sccache_cache_policy.py key

      - name: Restore sccache cache
        id: sccache-cache
        if: steps.sccache-install.outputs.available == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\sccache-cache
          key: ${{ steps.sccache-key.outputs.key }}
          restore-keys: sccache-win-x64-release-clang23-v1-

      - name: Apply patches and install the host
        run: python scripts/build.py prepare --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      # The CMake and ninja tree of an earlier build: exact on the same toolchain and inputs, otherwise the newest
      # with the same patches and config, then the newest with the same WebKit pin and toolchain (docs/CI.md).
      - name: Restore the build tree
        id: tree
        if: env.TREE_RESTORE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ steps.keys.outputs.tree }}
          restore-keys: ${{ steps.keys.outputs.tree-restore }}

      # The cache holds no GPU tree; a GPU cell restores the tree an earlier release tag's run left as an artifact, by
      # the cache's own key order (docs/CI.md, "GPU build trees"). A failed restore builds without a tree.
      - name: Restore the GPU build tree of an earlier release
        id: gpu-tree
        if: env.TREE_RESTORE == 'true' && matrix.flavor == 'gpu' && steps.tree.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT: ${{ steps.keys.outputs.tree }}
          PREFIXES: ${{ steps.keys.outputs.tree-restore }}
        run: python -I scripts/tree_artifacts.py restore --build "$BUILD_DIR" --exact "$EXACT" --prefixes "$PREFIXES"

      # A restored tree holds vcpkg_installed under the same vcpkg key, so vcpkg installs nothing and needs no archives.
      - name: Restore vcpkg archives
        id: vcpkg
        if: runner.os == 'Windows' && steps.tree.outputs.cache-matched-key == '' && steps.gpu-tree.outputs.matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\vcpkg-archives
          # Archives are named by their ABI hash, so an older entry's archives are used where they still match.
          key: ${{ steps.keys.outputs.vcpkg }}
          restore-keys: ${{ steps.keys.outputs.vcpkg-prefix }}

      # Sources of the ports vcpkg builds, which it needs only when an archive is missing.
      - name: Restore vcpkg downloads
        id: downloads
        if: runner.os == 'Windows' && steps.vcpkg.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\vcpkg-downloads
          key: ${{ steps.keys.outputs.downloads }}
          restore-keys: ${{ steps.keys.outputs.downloads-prefix }}

      # Gives the unchanged sources the times recorded with the tree, so that ninja rebuilds only what changed, and
      # deletes the tree's CMakeCache.txt, so that configure sets the options a clean configure would.
      - name: Match source times to the build tree
        run: python -I scripts/build_cache.py normalise --build "${{ env.BUILD_DIR }}" --source "${{ env.RANVIER_WORK }}/src" --clear-unknown

      - name: Configure (installs vcpkg packages on Windows)
        run: python scripts/build.py configure --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      # Only after a successful install: an entry saved under a key is never replaced.
      - name: Save vcpkg archives
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.vcpkg.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: C:\rw\vcpkg-archives
          key: ${{ steps.keys.outputs.vcpkg }}

      - name: Save vcpkg downloads
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.downloads.outcome == 'success' && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: C:\rw\vcpkg-downloads
          key: ${{ steps.keys.outputs.downloads }}

      # What ninja will rebuild and why: a reused tree that rebuilds much names the input here.
      - name: Explain the build
        continue-on-error: true
        run: python -I scripts/build_cache.py explain --build "${{ env.BUILD_DIR }}"

      - name: Read sccache budget before build
        id: sccache-preflight
        if: steps.sccache-install.outputs.available == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCCACHE_USAGE_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/cache/usage
        run: python -I scripts/sccache_cache_policy.py preflight

      - name: sccache stats before build
        if: steps.sccache-install.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats

      - name: Build
        run: python scripts/build.py build --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: sccache stats after build
        if: steps.sccache-install.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats

      # Prune only the old main-ref entries under this cache family, after a successful compile and a passing
      # preflight. Never delete this week's immutable key. If deletion fails the save gate remains closed.
      - name: Prune old sccache entries
        id: sccache-cleanup
        if: >-
          steps.sccache-install.outputs.available == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.sccache-preflight.outputs.usage_available == 'true' &&
          steps.sccache-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -I scripts/sccache_cache_policy.py cleanup
          --current-key "${{ steps.sccache-key.outputs.key }}"

      - name: Check sccache save budget
        id: sccache-gate
        if: steps.sccache-install.outputs.available == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCCACHE_USAGE_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/cache/usage
          SCCACHE_CACHE_HIT: ${{ steps.sccache-cache.outputs.cache-hit }}
          SCCACHE_PREFLIGHT_USAGE: ${{ steps.sccache-preflight.outputs.usage_bytes }}
          SCCACHE_CLEANUP_OK: ${{ steps.sccache-cleanup.outputs.previous_prefix_pruned }}
        run: |
          $policyArgs = @(
            'gate', '--cache-dir', 'C:\rw\sccache-cache', '--usage-url', $env:SCCACHE_USAGE_URL,
            '--token', $env:GITHUB_TOKEN, '--cohort', 'windows-x64-release',
            '--preflight-usage', $env:SCCACHE_PREFLIGHT_USAGE,
            '--event-name', $env:GITHUB_EVENT_NAME, '--ref', $env:GITHUB_REF,
            '--compile-succeeded'
          )
          if ($env:SCCACHE_CACHE_HIT -eq 'true') { $policyArgs += '--weekly-key-exists' }
          if ($env:SCCACHE_CLEANUP_OK -eq 'true') { $policyArgs += '--previous-prefix-pruned' }
          python -I scripts/sccache_cache_policy.py @policyArgs

      - name: Save sccache cache
        id: sccache-save
        if: steps.sccache-gate.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\rw\sccache-cache
          key: ${{ steps.sccache-key.outputs.key }}

      - name: Verify saved sccache archive size
        id: sccache-verify
        if: steps.sccache-save.outcome == 'success'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -I scripts/sccache_cache_policy.py verify
          --current-key "${{ steps.sccache-key.outputs.key }}"

      # Right after the build, so that a later failure keeps it. An exact hit has nothing new to save.
      - name: Save the build tree
        id: save-tree
        if: env.TREE_SAVE == 'true' && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ steps.keys.outputs.tree }}

      # The entry this run restored and has now replaced, when it is this ref's own: one tree per runtime and ref
      # keeps the cache inside the repository's 10 GB. An entry of another ref (the base branch's) is not deleted.
      - name: Delete the superseded build tree
        if: >-
          steps.save-tree.outcome == 'success' && steps.tree.outputs.cache-matched-key != '' &&
          steps.tree.outputs.cache-matched-key != steps.keys.outputs.tree
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.tree.outputs.cache-matched-key }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$STALE&ref=$GITHUB_REF" \
            || echo "no entry $STALE under $GITHUB_REF"

      # For the next release tag's GPU cell; an exact restore has nothing new. A failure here costs that cell a cold
      # build, never this release.
      - name: Pack the GPU build tree for the next release
        id: pack-gpu-tree
        if: >-
          matrix.flavor == 'gpu' && startsWith(github.ref, 'refs/tags/v') &&
          steps.gpu-tree.outputs.matched-key != steps.keys.outputs.tree
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-tree"
          python -I scripts/tree_artifacts.py pack --build "$BUILD_DIR" --output "$RUNNER_TEMP/gpu-tree/tree.tar.gz"

      - name: Upload the GPU build tree
        if: steps.pack-gpu-tree.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keys.outputs.tree }}
          path: ${{ runner.temp }}/gpu-tree/tree.tar.gz
          retention-days: 90
          compression-level: 0

      - name: Delete the packed GPU build tree
        if: steps.pack-gpu-tree.outcome != 'skipped'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/gpu-tree"

      - name: Package
        run: python scripts/build.py package --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/packages/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/manifest.json
          if-no-files-found: error

      # The sidecars serve the reviewed public Cocoa cohort, whose ABI build_cocoa_sidecars.py names. A producer
      # of another ABI cannot match that cohort, so it builds none.
      - name: Match the reviewed Cocoa cohort's ABI
        id: cocoa-cohort
        if: matrix.rid == 'osx-arm64' && (env.FLAVOR == 'slim' || env.FLAVOR == 'gpu')
        shell: bash
        run: |
          python -B -I - tests/controls/build_cocoa_sidecars.py "$RANVIER_WORK/out/$FLAVOR/manifest.json" >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location('sidecars', sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          abi = json.load(open(sys.argv[2]))['abi']
          if abi != module.COHORT_ABI:
              print(f'::notice::No Cocoa sidecars: the producer is ABI {abi}, the reviewed cohort ABI {module.COHORT_ABI}.',
                    file=sys.stderr)
          print('match=' + str(abi == module.COHORT_ABI).lower())
          PY

      - name: Build matching macOS CPU test sidecars
        if: matrix.rid == 'osx-arm64' && (env.FLAVOR == 'slim' || env.FLAVOR == 'gpu') && steps.cocoa-cohort.outputs.match == 'true'
        timeout-minutes: 15
        run: >-
          python -B -I tests/controls/build_cocoa_sidecars.py
          --stage "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}"
          --build "${{ env.BUILD_DIR }}"
          --webkit-source "${{ env.RANVIER_WORK }}/src"
          --packages "${{ env.RANVIER_WORK }}/packages"
          --output "${{ runner.temp }}/cocoa-sidecars-${{ env.FLAVOR }}"

      - name: Retain matching macOS CPU test sidecars
        if: always() && matrix.rid == 'osx-arm64' && (env.FLAVOR == 'slim' || env.FLAVOR == 'gpu') && steps.cocoa-cohort.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cocoa-sidecars-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ runner.temp }}/cocoa-sidecars-${{ env.FLAVOR }}
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/symbols

      - name: Check the staged files and paint a page
        # scripts/smoke.py, as a local build.py all runs it: the host loads from the staged package, and on macOS
        # no staged library names the build tree. On Linux, loading is untested and the step checks the manifest.
        run: python scripts/build.py smoke --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Verify mutation observation delivery and ownership
        timeout-minutes: 5
        env:
          EGL_PLATFORM: ${{ startsWith(matrix.rid, 'linux-') && 'surfaceless' || '' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ startsWith(matrix.rid, 'linux-') && '1' || '' }}
        run: >-
          python -I -X utf8 tests/abi/mutation_observation.py
          --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      # Every probe in scripts/probes.py that applies to the runtime, each with its own condition and timeout. The
      # step runs them all and fails at the end when any failed, so one run reports every failing probe.
      - name: Install the bounded GPU qualification dependency
        if: env.FLAVOR == 'gpu' && (matrix.rid == 'win-x64' || matrix.rid == 'linux-x64')
        run: python -m pip install numpy==2.4.3

      - name: Check the GPU format qualification policy
        if: env.FLAVOR == 'gpu' && (matrix.rid == 'win-x64' || matrix.rid == 'linux-x64')
        run: python -I tests/test_p7_sampler_format_policy.py

      - name: Check producer stage and child-tree ownership
        if: env.FLAVOR == 'gpu' && (matrix.rid == 'win-x64' || matrix.rid == 'linux-x64')
        env:
          RANVIER_GPU_JOB_TEST_RECEIPT: ${{ env.RANVIER_WORK }}/gpu-child-cleanup-control.json
        run: python -I tests/test_producer_gpu_clipping.py

      - name: Run the probes
        run: python -I scripts/probes.py run --rid ${{ matrix.rid }} --flavor ${{ env.FLAVOR }} --work "${{ env.RANVIER_WORK }}"

      - name: Upload the probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/probe-logs
          if-no-files-found: ignore

      - name: Retain macOS public texture qualification
        if: always() && env.FLAVOR == 'gpu' && matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: mac-gpu-public-qualification
          path: ${{ env.RANVIER_WORK }}/mac-gpu-public-qualification
          if-no-files-found: warn

      - name: Retain native PDF output and ownership results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printing-report-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: |
            ${{ env.RANVIER_WORK }}/printing-pdf.json
            ${{ env.RANVIER_WORK }}/host-output.pdf
          if-no-files-found: ignore

      - name: Retain clipping pixel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipping-report-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: |
            ${{ env.RANVIER_WORK }}/background-content-clipping-regression.json
            ${{ env.RANVIER_WORK }}/gpu-clipping-qualification
            ${{ env.RANVIER_WORK }}/gpu-child-cleanup-control.json
          if-no-files-found: ignore

      - name: Retain Windows owner-thread exit results
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: owner-thread-exit-report-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/owner-thread-exit.json
          if-no-files-found: ignore

      - name: Retain IME mutation and reentry results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-surrounding-report-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/ime-surrounding-observation*.json
          if-no-files-found: ignore

      - name: Upload the CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: |
            ${{ env.RANVIER_WORK }}/build-${{ env.FLAVOR }}/CMakeCache.txt
            ${{ env.RANVIER_WORK }}/build-${{ env.FLAVOR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.RANVIER_WORK }}/build-${{ env.FLAVOR }}/vcpkg-manifest-install.log
            ${{ env.RANVIER_WORK }}/vcpkg/buildtrees/**/*.log

  managed:
    needs: [native, prebuilt, package-contract]
    if: >-
      ${{ !cancelled() && inputs.rids == '' && (inputs.flavor == '' || inputs.flavor == 'slim') && !(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'codex/batch-') && !contains(github.event.pull_request.labels.*.name, 'full-matrix')) && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') && needs.package-contract.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The Slim runtimes, and on a version tag the GPU runtimes, for the two native aggregates.
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*-slim
          merge-multiple: true
          path: packages
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          pattern: package-*-gpu
          merge-multiple: true
          path: packages
      - name: Pack the ABI-matched managed interop and native aggregates
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('pins.json'))['package']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python -I scripts/package_managed.py --packages packages --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: package-managed
          path: |
            packages/Ranvier.WebCore.[0-9]*.nupkg
            packages/Ranvier.WebCore.Native.[0-9]*.nupkg
            packages/Ranvier.WebCore.Native.Cpu.[0-9]*.nupkg
            packages/Ranvier.WebCore.Native.Gpu.[0-9]*.nupkg
          # The native RID packages are already retained by their platform jobs.

  atspi:
    # Builds the AT-SPI provider against this run's Linux Slim hosts and qualifies it on the runtime's own runner,
    # for every release that packs the managed cohort.
    needs: [native, prebuilt, package-contract]
    if: >-
      ${{ !cancelled() && inputs.rids == '' && (inputs.flavor == '' || inputs.flavor == 'slim') && !(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'codex/batch-') && !contains(github.event.pull_request.labels.*.name, 'full-matrix')) && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') && needs.package-contract.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            pack: ''
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            pack: --test-only-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.rid }}-slim
          path: ${{ runner.temp }}/atspi/artifact
      - name: Install the provider build and protocol client prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libglib2.0-dev libatspi2.0-dev python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 fonts-dejavu-core unzip
          sudo apt-get install -y libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 libwebp7 libwebpdemux2 libwebpmux3 zlib1g libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2 liblcms2-2 libatomic1
      - name: Stage this run's host
        run: |
          W="$RUNNER_TEMP/atspi"; echo "W=$W" >> "$GITHUB_ENV"
          version=$(python3 -c "import json; print(json.load(open('pins.json'))['package']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          package=$(ls "$W"/artifact/Ranvier.WebCore.Native.Cpu.$RID.*.nupkg)
          sha=$(unzip -p "$package" "runtimes/$RID/native/libRanvierWebCoreHost.so" | sha256sum | cut -d' ' -f1)
          python3 -I tests/atspi/stage_native.py --artifacts "$W/artifact" --rid "$RID" --expected-sha256 "$sha" --output "$W/native"
          ldd "$W/native/libRanvierWebCoreHost.so" | tee "$W/native/runtime-dependencies.txt"
          if grep -q 'not found' "$W/native/runtime-dependencies.txt"; then exit 1; fi
      - name: Build and install the provider
        run: |
          python3 -I -m unittest discover -s tests/atspi -p 'test_*.py'
          cmake -S providers/atspi -B "$W/build" -G Ninja -DRANVIER_WEBCORE_LIBRARY:FILEPATH="$W/native/libRanvierWebCoreHost.so"
          cmake --build "$W/build" --parallel 2
          ctest --test-dir "$W/build" --output-on-failure
          cmake --install "$W/build" --prefix "$W/install"
      - name: Direct style and AT-SPI protocol runs
        run: |
          provider="$W/install/lib/libRanvierWebCoreAtspi.so"; host="$W/native/libRanvierWebCoreHost.so"
          python3 -I tests/abi/accessibility_text_styles.py --native-directory "$W/native" --report "$W/direct-style-report.json"
          python3 -I tests/atspi/run.py run --native "$host" --provider "$provider" --output "$W/protocol" --registry --extended-text
          python3 -I tests/atspi/run.py run --native "$host" --provider "$provider" --output "$W/protocol-queued" --registry --extended-text --queued-set
          python3 -I tests/atspi/run.py run --native "$host" --provider "$provider" --output "$W/protocol-session" --registry --extended-text --discovery session
      - name: SDK consumer load
        run: |
          python3 -I providers/atspi/package.py --provider "$W/install/lib/libRanvierWebCoreAtspi.so" --native "$W/native/libRanvierWebCoreHost.so" --rid "$RID" ${{ matrix.pack }} --id Ranvier.Private.Accessibility.Atspi.Qualification --version "0.0.0-ci.$GITHUB_RUN_ID" --source-revision "$GITHUB_SHA" --output "$W/package"
          python3 -I tests/atspi/consumer.py --package "$W/package/Ranvier.Private.Accessibility.Atspi.Qualification.0.0.0-ci.$GITHUB_RUN_ID.nupkg" --native "$W/native/libRanvierWebCoreHost.so" --output "$W/consumer"
      - name: Record the qualified build
        run: |
          mkdir "$W/release"
          cp "$W/install/lib/libRanvierWebCoreAtspi.so" "$W/release/"
          python3 -I - "$W" <<'EOF'
          import hashlib, json, os, sys
          from pathlib import Path
          work = Path(sys.argv[1])
          provider = (work / 'release/libRanvierWebCoreAtspi.so').read_bytes()
          host = (work / 'native/libRanvierWebCoreHost.so').read_bytes()
          receipt = json.loads((work / 'consumer/consumer-receipt.json').read_text())
          (work / 'release/build-receipt.json').write_text(json.dumps(dict(
              rid=os.environ['RID'], version=os.environ['VERSION'], abi=receipt['selectedRuntime']['abi'],
              providerSha256=hashlib.sha256(provider).hexdigest(), hostSha256=hashlib.sha256(host).hexdigest(),
              protocolPassed=True, consumerPassed=receipt['executed'], directStylePassed=True,
              sourceCommit=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID']), indent=2) + '\n')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: atspi-build-${{ matrix.rid }}
          path: ${{ env.W }}/release/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-reports-${{ matrix.rid }}
          path: |
            ${{ env.W }}/native/producer-receipt.json
            ${{ env.W }}/direct-style-report.json
            ${{ env.W }}/protocol*/
            ${{ env.W }}/consumer/consumer-receipt.json
          if-no-files-found: warn
          retention-days: 14

  atspi-package:
    # Packs the public Ranvier.WebCore.Accessibility.Atspi package at the release version from both qualified builds.
    needs: atspi
    if: ${{ !cancelled() && needs.atspi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: atspi-build-*
          path: ${{ runner.temp }}/builds
      - name: Pack and check RID selection
        run: |
          version=$(python3 -c "import json; print(json.load(open('pins.json'))['package']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          B="$RUNNER_TEMP/builds"
          python3 -I providers/atspi/release.py --version "$version" --build "linux-x64=$B/atspi-build-linux-x64" --build "linux-arm64=$B/atspi-build-linux-arm64" --output packages --work "$RUNNER_TEMP/atspi-pack"
          for rid in linux-x64 linux-arm64; do
            python3 -I tests/atspi/consumer.py --package "packages/Ranvier.WebCore.Accessibility.Atspi.$version.nupkg" --rid "$rid" --layout-only --output "$RUNNER_TEMP/layout-$rid"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: package-atspi
          path: packages/Ranvier.WebCore.Accessibility.Atspi.*.nupkg

  # The one check branch protection requires. A pull request's cell list is fixed by plan, so native must have run
  # unless a version tag took every cell from prebuilt; publish is left out because it runs only on a tag.
  result:
    name: CI result
    needs: [package-contract, plan, prebuilt, native, managed, atspi, atspi-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          ALWAYS_RUN: ${{ needs.package-contract.result }} ${{ needs.plan.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
          for result in $ALWAYS_RUN; do
            test "$result" = success
          done
          case "$GITHUB_REF" in refs/tags/v*) ;; *) test "$NATIVE" = success ;; esac

  publish:
    # On a version tag, pushes the packages to nuget.org through trusted publishing: the job exchanges
    # GitHub's OIDC token for a one-hour API key under the nuget.org account in the repository variable
    # NUGET_USER, whose trusted publishing policy names this file. Without NUGET_USER, the packages stay
    # as workflow artifacts. Every selected runtime and the contract gate must pass before any push;
    # a full slim release also requires the paired managed cohort and the AT-SPI provider package.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != '' && needs.package-contract.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') && (needs.native.result == 'success' || needs.prebuilt.result == 'success') && ((needs.managed.result == 'success' && needs.atspi-package.result == 'success') || (needs.managed.result == 'skipped' && (inputs.flavor == 'gpu' || inputs.flavor == 'lean'))) }}
    needs: [native, prebuilt, managed, atspi-package, package-contract]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

