        run: |
          python -I tests/uia/check_exports.py "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
