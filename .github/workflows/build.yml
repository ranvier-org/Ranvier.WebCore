# Builds the native package for each runtime in the matrix (docs/CI.md). A manual run can build a subset.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        type: choice
        options: [slim, gpu, lean]
        default: slim
      rids:
        description: Runtime identifiers to build, comma-separated (empty for all)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -I tests/test_package_contract.py
      - run: python -I tests/test_release.py
      - run: python -I tests/test_publish_gate.py
      - run: python -I tests/test_host_prepare.py
      - run: python -I tests/generator/test_domgen.py
      - run: python -I scripts/capability_catalogue.py --check
      - run: python -I tests/abi/generate_native.py check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore multi-RID packages and verify resource layout
        run: python -I tests/test_resource_packages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Portable tools precede RID-specific tools in the manifest to avoid SDK cold-cache command
      # misattribution (https://github.com/dotnet/sdk/issues/53783).
      - run: dotnet tool restore
      - name: Compile the full shared contracts on .NET
        run: dotnet build tests/generator/Contracts.fsproj -c Release
      - name: Compile and execute inherited DOM member implementations
        run: |
          python -I tests/generator/write_inherited_fixture.py artifacts/inherited-fixture
          dotnet run --project artifacts/inherited-fixture/Fixture.fsproj -c Release
      - name: Check the generated F# layout
        run: dotnet fantomas --check gen/Ranvier.Dom.fs
      - name: Compile and execute the browser union adapters
        run: |
          python -I tests/generator/write_fable_fixture.py artifacts/dom-fixture
          dotnet fickl artifacts/dom-fixture/Fixture.fsproj --outDir artifacts/dom-fixture/js
          node artifacts/dom-fixture/js/Program.js
      - name: Compile and execute the full generated browser contracts
        run: |
          dotnet fickl tests/generator/browser/FullBrowser.fsproj --outDir artifacts/full-browser/js --noCache --extension .js
          node artifacts/full-browser/js/FullBrowser.js
      - name: Verify named getters against actual Chromium DOM objects
        run: |
          dotnet fickl tests/generator/browser/NamedLookupBrowser.fsproj --outDir artifacts/named-lookup/js --noCache --extension .js
          python -I tests/generator/browser/run_named_lookup.py --browser "$(command -v google-chrome)" --output artifacts/named-lookup/js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-lookup-browser-proof
          path: artifacts/named-lookup/js/named-lookup-*.html
          if-no-files-found: ignore

  plan:
    # The matrix, filtered by the manual run's rids input. On a version tag whose release holds a runtime's
    # package, attached by scripts/release.py as the repository owner, that runtime goes to prebuilt instead.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prebuilt: ${{ steps.plan.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pins.json
          sparse-checkout-cone-mode: false
      - id: plan
        shell: python
        env:
          RIDS: ${{ inputs.rids }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-matrix') }}
          FLAVOR: ${{ inputs.flavor || 'slim' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.error, urllib.request
          # A WebKit build needs about 10 GB of disk and runs for hours on the standard runners.
          runtimes = [
              # work: a short root on Windows, where WebKit's generated paths exceed MAX_PATH under the
              # default workspace.
              dict(rid='win-x64', runner='windows-2025', work='C:\\rw'),
              dict(rid='win-arm64', runner='windows-11-arm', work='C:\\rw'),
              dict(rid='linux-x64', runner='ubuntu-24.04', work='/mnt/rw'),
              dict(rid='linux-arm64', runner='ubuntu-24.04-arm', work='/mnt/rw'),
              # macOS runners have one volume; the home directory is on its data volume. macos-26, because the
              # newest Xcode on macos-15 (26.3) cannot build WebKit's Swift sources (docs/CI.md).
              dict(rid='osx-arm64', runner='macos-26', work='/Users/runner/rw'),
          ]
          wanted = [r.strip() for r in os.environ.get('RIDS', '').split(',') if r.strip()]
          # A pull request builds win-x64 only, unless it is a batch branch or carries the full-matrix label.
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and not os.environ['HEAD_REF'].startswith('codex/batch-') \
                  and os.environ['FULL_LABEL'] != 'true':
              wanted = ['win-x64']
          include = [r for r in runtimes if not wanted or r['rid'] in wanted]
          if not include:
              raise SystemExit(f'no runtime matches {wanted}')
          prebuilt = []
          ref, owner = os.environ['GITHUB_REF'], os.environ['GITHUB_REPOSITORY_OWNER']
          if ref.startswith('refs/tags/v'):
              tag = ref.removeprefix('refs/tags/')
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}",
                  headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
              try:
                  release = json.load(urllib.request.urlopen(request, timeout=60))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  release = None
              # Only the owner's: anyone who can push a tag could otherwise attach a package to be published.
              assets = {a['name'] for a in release['assets'] if a['uploader']['login'] == owner} \
                  if release and release['author']['login'] == owner else set()
              package = json.load(open('pins.json'))['package']['id'] + {'slim': '', 'gpu': '.Gpu', 'lean': '.Lean'}[os.environ['FLAVOR']]
              for runtime in include:
                  name = f"{package}.{runtime['rid']}.{tag[1:]}.nupkg"
                  if name in assets:
                      prebuilt.append(dict(runtime, asset=name))
          build = [r for r in include if r['rid'] not in {p['rid'] for p in prebuilt}]
          print('build:', *(r['rid'] for r in build), '- prebuilt:', *(p['rid'] for p in prebuilt))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              # An empty string for an empty list, which the jobs' conditions test.
              out.write('matrix=' + (json.dumps(dict(include=build)) if build else '') + '\n')
              out.write('prebuilt=' + (json.dumps(dict(include=prebuilt)) if prebuilt else '') + '\n')

  prebuilt:
    # A runtime whose package was built and checked on the owner's machine by scripts/release.py: checked
    # again here, on a clean runner of its platform, against the tag's commit, then passed to publish.
    needs: plan
    if: needs.plan.outputs.prebuilt != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prebuilt) }}
    runs-on: ${{ matrix.runner }}
    env:
      FLAVOR: ${{ inputs.flavor || 'slim' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download the package from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '${{ matrix.asset }}' --dir packages

      - name: Check the package and paint a page
        shell: bash
        run: >-
          python scripts/smoke.py --package 'packages/${{ matrix.asset }}' --expect-commit "$GITHUB_SHA"
          --expect-version "${GITHUB_REF_NAME#v}" --expect-flavor "$FLAVOR"
          ${{ startsWith(matrix.rid, 'linux') && '--no-load' || '' }}

      - name: Verify packaged CSS queries, computed styles and fragment rectangles
        if: env.FLAVOR == 'slim'
        shell: bash
        run: python -I scripts/check_package_api.py --package 'packages/${{ matrix.asset }}'

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: packages/*.nupkg

  native:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      FLAVOR: ${{ inputs.flavor || 'slim' }}
      RANVIER_WORK: ${{ matrix.work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The F# ABI tests of the smoke step target .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Each downloaded dependency has its own cache, restored before it is needed and saved as soon as it is
      # fetched, so a later failure does not discard it and a package host's outage only matters on a miss.
      - name: Cache keys
        id: keys
        shell: python
        run: |
          import hashlib, json, os
          pins = json.load(open('pins.json'))
          rid = '${{ matrix.rid }}'
          # Keyed on the pins each one uses, not the whole file, which also holds the package version.
          llvm = pins['llvm'].get(rid, {}).get('sha256', 'none')
          vcpkg = hashlib.sha256(json.dumps([pins['vcpkg'], pins['webkit'], pins['icu']]).encode()).hexdigest()[:16]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"llvm=llvm-{rid}-{llvm}\nvcpkg=vcpkg-{rid}-{os.environ['FLAVOR']}-{vcpkg}\n")

      - name: Restore gperf
        id: gperf
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\tools\gperf
          key: gperf-3.1.0-${{ matrix.rid }}

      - name: Install gperf
        if: runner.os == 'Windows' && steps.gperf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Chocolatey's feed fails transiently: 503 and 504 on 2026-10-27.
          for ($attempt = 1; ; $attempt++) {
            choco install gperf --version 3.1.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { exit 1 }
            Start-Sleep (30 * $attempt)
          }
          New-Item -ItemType Directory -Force C:\rw\tools\gperf | Out-Null
          Copy-Item C:\ProgramData\chocolatey\lib\gperf\tools\* C:\rw\tools\gperf -Recurse -Exclude *.zip

      - name: Save gperf
        if: runner.os == 'Windows' && steps.gperf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\rw\tools\gperf
          key: gperf-3.1.0-${{ matrix.rid }}

      - name: Put gperf on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:\rw\tools\gperf -Recurse -Filter gperf.exe | Select-Object -First 1
          if (-not $exe) { throw 'no gperf.exe under C:\rw\tools\gperf' }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName

      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: |
          # Acquire::Retries retries a download that fails at the mirror.
          sudo apt-get -o Acquire::Retries=5 update -q
          grep -v '^#' scripts/linux-packages.txt | xargs sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends
          sudo mkdir -p "$RANVIER_WORK" && sudo chown "$USER" "$RANVIER_WORK"

      - name: Install the macOS tools
        if: runner.os == 'macOS'
        run: |
          # WebKit's Mac port builds Swift sources that need a recent Xcode: the newest released Xcode 26.
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          # No auto-update: it fetches Homebrew's taps, which installing a bottle does not need.
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for tool in gperf ninja cmake; do
            command -v $tool >/dev/null && continue
            for attempt in 1 2 3 4; do
              brew install $tool && break
              [ $attempt = 4 ] && exit 1
              sleep $((30 * attempt))
            done
          done
          mkdir -p "$RANVIER_WORK"

      - name: Tool versions and disk
        shell: pwsh
        run: |
          python --version; perl -v | Select-Object -Skip 1 -First 1; ruby -v; gperf --version | Select-Object -First 1
          cmake --version | Select-Object -First 1; dotnet --version
          if ($IsWindows) {
            $env:VCPKG_DOWNLOADS = "$env:RANVIER_WORK\vcpkg-downloads"
            New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS, "$env:RANVIER_WORK\vcpkg-archives" | Out-Null
            Add-Content $env:GITHUB_ENV "VCPKG_DOWNLOADS=$env:VCPKG_DOWNLOADS"
            Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$env:RANVIER_WORK\vcpkg-archives,readwrite"
          } else {
            clang --version | Select-Object -First 1
            df -h $env:RANVIER_WORK
          }

      - name: Restore vcpkg archives and downloads
        id: vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\rw\vcpkg-archives
            C:\rw\vcpkg-downloads
          # Archives are named by their ABI hash, so an older entry's archives are used where they still match.
          key: ${{ steps.keys.outputs.vcpkg }}-${{ hashFiles('config/**') }}
          restore-keys: vcpkg-${{ matrix.rid }}-${{ env.FLAVOR }}-

      - name: Restore LLVM
        id: llvm
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: C:\rw\tools\llvm
          key: ${{ steps.keys.outputs.llvm }}

      - name: Package version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "RANVIER_PACKAGE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))"

      - name: Fetch WebKit (and on Windows vcpkg and LLVM)
        run: python scripts/build.py fetch --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Save LLVM
        if: runner.os == 'Windows' && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\rw\tools\llvm
          key: ${{ steps.keys.outputs.llvm }}

      - name: Apply patches and install the host
        run: python scripts/build.py prepare --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Configure (installs vcpkg packages on Windows)
        run: python scripts/build.py configure --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Save vcpkg archives and downloads
        # Only after a successful install: an entry saved under a key is never replaced.
        if: runner.os == 'Windows' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\rw\vcpkg-archives
            C:\rw\vcpkg-downloads
          key: ${{ steps.keys.outputs.vcpkg }}-${{ hashFiles('config/**') }}

      - name: Build
        run: python scripts/build.py build --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Package
        run: python scripts/build.py package --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/packages/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/manifest.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.rid }}-${{ env.FLAVOR }}
          path: ${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/symbols

      - name: Check the staged files and paint a page
        # scripts/smoke.py, as a local build.py all runs it: the host loads from the staged package, and on macOS
        # no staged library names the build tree. On Linux, loading is untested and the step checks the manifest.
        run: python scripts/build.py smoke --flavor ${{ env.FLAVOR }} --rid ${{ matrix.rid }}

      - name: Exercise typed DOM transport against the packaged native host
        if: matrix.rid == 'win-x64' && env.FLAVOR == 'slim'
        run: python -I tests/generator/native_types.py --native-dir "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify document-scoped CSS support queries
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/css_supports.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify live computed styles and pseudo-elements
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/computed_style.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify fragment rectangle lists and retained snapshots
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/fragment_rectangles.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify paused animation effects after keyframe edits
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/keyframe_rules.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify counter style name and rendered marker edits
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/counter_style_rules.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify retained CSSOM settings context and isolated descriptor edits
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/detached_cssom_context.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify custom property registration and interpolation
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/custom_properties.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed CSS value parsing and owned segments
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/typed_style_values.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed style maps
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/style_property_maps.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify declared typed map mutation isolation
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/declared_style_maps.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed style map entry snapshots
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/style_map_entries.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify geometry values and retained mutable points
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/geometry_values.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify matrix values and transformations
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/matrix_values.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed CSS transform components
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/css_transforms.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify SVG shapes, text and SMIL timing
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_surfaces.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native" --webkit-source "${{ env.RANVIER_WORK }}/src"

      - name: Verify SVG gradients, patterns and stops
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_paint_servers.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify every SVG filter primitive and light source
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_filters.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify SVG clipping, masks and markers
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_clip_mask_marker.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify SVG reuse, content and resource loads
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_resources.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify image decode readiness without JavaScript
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/image_decode.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify font readiness without JavaScript
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/font_load.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native" --webkit-source "${{ env.RANVIER_WORK }}/src"

      - name: Verify SVGTests lists after attribute removal
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/svg_tests_lists.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed MathML elements, styling and focus
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/mathml_surface.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify typed and custom event construction and standalone targets
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/event_construction.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify the window event target, activation, touch capacity and pointer capture
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/focus_input.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify window metrics, visibility, media queries and viewport event order
        if: env.FLAVOR == 'slim'
        run: python -I tests/abi/viewport_events.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify form collections, FormData and submit events against the Chromium oracle
        if: env.FLAVOR == 'slim'
        run: python -I -X utf8 tests/abi/form_collections.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify fractional viewport and element scrolling against the Chromium oracle
        if: env.FLAVOR == 'slim'
        run: python -I -X utf8 tests/abi/viewport_scroll.py --native-directory "${{ env.RANVIER_WORK }}/out/${{ env.FLAVOR }}/runtimes/${{ matrix.rid }}/native"

      - name: Verify dialogs, popovers and command invokers against the Chromium oracle
        if: env.FLAVOR == 'slim'
