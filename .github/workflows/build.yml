            ${{ env.RANVIER_WORK }}/build-${{ env.FLAVOR }}/vcpkg-manifest-install.log
            ${{ env.RANVIER_WORK }}/vcpkg/buildtrees/**/*.log

  managed:
    needs: [native, prebuilt, package-contract]
    if: >-
      ${{ !cancelled() && inputs.rids == '' && (inputs.flavor == '' || inputs.flavor == 'slim') &&
          !(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'codex/batch-') &&
            !contains(github.event.pull_request.labels.*.name, 'full-matrix')) &&
          (needs.native.result == 'success' || needs.native.result == 'skipped') &&
          (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') &&
          needs.package-contract.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*-slim
          merge-multiple: true
          path: packages
      - name: Pack the ABI-matched managed interop and native aggregate
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('pins.json'))['package']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python -I scripts/package_managed.py --packages packages --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: package-managed
          path: |
            packages/Ranvier.WebCore.[0-9]*.nupkg
            packages/Ranvier.WebCore.Native.[0-9]*.nupkg
          # The native RID packages are already retained by their platform jobs.

  publish:
    # On a version tag, pushes the packages to nuget.org through trusted publishing: the job exchanges
    # GitHub's OIDC token for a one-hour API key under the nuget.org account in the repository variable
    # NUGET_USER, whose trusted publishing policy names this file. Without NUGET_USER, the packages stay
    # as workflow artifacts. Every selected runtime and the contract gate must pass before any push;
    # a full slim release also requires the paired managed cohort.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != '' &&
          needs.package-contract.result == 'success' &&
          (needs.native.result == 'success' || needs.native.result == 'skipped') &&
          (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') &&
          (needs.native.result == 'success' || needs.prebuilt.result == 'success') &&
          (needs.managed.result == 'success' ||
           (needs.managed.result == 'skipped' && (inputs.flavor == 'gpu' || inputs.flavor == 'lean'))) }}
    needs: [native, prebuilt, managed, package-contract]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
