name: Preview 7 GPU artifact recovery (unarmed)

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Independently reviewed qualification run (must match pinned verifier)
        required: true
        type: string

concurrency:
  group: preview7-gpu-recovery-${{ github.run_id }}
  cancel-in-progress: false

# Both jobs are deliberately disabled. A reviewed successor must pin the
# qualification and evidence in the verifier before either guard is enabled.
jobs:
  verify:
    if: ${{ false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: package-win-x64-gpu
          path: original/package
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: manifest-win-x64-gpu
          path: original/manifest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: probe-logs-win-x64-gpu
          path: original/probe
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: clipping-report-win-x64-gpu
          path: original/clipping
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run }}
          name: p7-gpu-qualification
          path: original/evidence
      - name: Verify immutable producer and qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: >-
          python -I scripts/recover_preview7_gpu.py
          --package original/package/Ranvier.WebCore.Native.Gpu.win-x64.0.1.1-preview.7.nupkg
          --manifest original/manifest/manifest.json --evidence original/evidence
          --producer-summary original/probe/summary.txt
          --original-report original/clipping/background-content-clipping-regression.json
          --qualification "$QUALIFICATION_RUN"
          --receipt recovery/verification.json --export recovery/export
      - uses: actions/upload-artifact@v4
        with:
          name: preview7-gpu-recovery-verification
          path: recovery/verification.json
          if-no-files-found: error

  publish:
    needs: [verify]
    if: ${{ false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && vars.NUGET_USER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: package-win-x64-gpu
          path: original/package
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: manifest-win-x64-gpu
          path: original/manifest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: probe-logs-win-x64-gpu
          path: original/probe
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41498246594
          name: clipping-report-win-x64-gpu
          path: original/clipping
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run }}
          name: p7-gpu-qualification
          path: original/evidence
      - name: Revalidate before authentication
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: >-
          python -I scripts/recover_preview7_gpu.py
          --package original/package/Ranvier.WebCore.Native.Gpu.win-x64.0.1.1-preview.7.nupkg
          --manifest original/manifest/manifest.json --evidence original/evidence
          --producer-summary original/probe/summary.txt
          --original-report original/clipping/background-content-clipping-regression.json
          --qualification "$QUALIFICATION_RUN"
          --receipt recovery/pre-push.json --export recovery/export
      - uses: actions/upload-artifact@v4
        with:
          name: preview7-gpu-recovery-pre-push
          path: recovery/pre-push.json
          if-no-files-found: error
      - name: Authenticate after verification
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish only the unchanged producer package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push recovery/export/Ranvier.WebCore.Native.Gpu.win-x64.0.1.1-preview.7.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
