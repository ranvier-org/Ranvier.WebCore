name: Preview 7 Linux GPU artifact recovery

on:
  workflow_dispatch:

concurrency:
  group: preview7-linux-gpu-recovery-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check recovery contract
        run: python -I tests/test_preview7_linux_recovery.py
      - name: Download and verify immutable producer and qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/prepare_preview7_linux_gpu.py --work "$RUNNER_TEMP/p7-linux-verify"
      - uses: actions/upload-artifact@v4
        with:
          name: p7-linux-recovery-verification
          path: ${{ runner.temp }}/p7-linux-verify/verification.json
          if-no-files-found: error

  publish:
    needs: [verify]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && vars.NUGET_USER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Independently re-download and verify before authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/prepare_preview7_linux_gpu.py --work "$RUNNER_TEMP/p7-linux-publish"
      - uses: actions/upload-artifact@v4
        with:
          name: p7-linux-recovery-pre-push
          path: ${{ runner.temp }}/p7-linux-publish/verification.json
          if-no-files-found: error
      - name: Authenticate after verification
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish unchanged producer packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP/p7-linux-publish/export/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
