name: Cocoa C++ driver diagnostic

on:
  push:
    branches: [codex/project2-cocoa-cxx-driver]

permissions:
  contents: read

concurrency:
  group: cocoa-cxx-driver-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/codex/project2-cocoa-cxx-driver' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare actual driver aliases with the same strict ObjC++ control
        run: >-
          python3 -B -I tests/controls/cocoa_cxx_driver_diagnostic.py
          --output "${{ runner.temp }}/cocoa-cxx-driver-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocoa-cxx-driver-proof
          path: ${{ runner.temp }}/cocoa-cxx-driver-proof
          if-no-files-found: warn
          retention-days: 14
