name: Unarmed optional provider aggregate

on:
  workflow_dispatch:
    inputs:
      cohort_file: {description: Reviewed cohort JSON with allocated version and exact package/receipt hashes, required: true, type: string, default: providers/atspi/public-cohort.example.json}
      x64_run: {description: Independently qualified x64 provider run, required: true, type: string}
      x64_artifact: {description: Exact x64 qualification artifact, required: true, type: string}
      arm64_run: {description: Independently qualified ARM64 provider run, required: true, type: string}
      arm64_artifact: {description: Exact ARM64 qualification artifact, required: true, type: string}

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Require explicit complete cohort inputs before downloading artifacts
        shell: python {0}
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
        run: |
          import json, os, runpy
          from pathlib import Path
          path = Path(os.environ['COHORT_FILE']).resolve()
          if not path.is_relative_to(Path('providers/atspi').resolve()) or path.suffix != '.json':
              raise ValueError('Select a reviewed provider cohort JSON.')
          module = runpy.run_path('providers/atspi/public_aggregate.py', run_name='aggregate_policy')
          module['validate_policy'](json.loads(path.read_text()))
          work = Path(os.environ['RUNNER_TEMP']) / 'atspi-aggregate'
          work.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('ATSPI_AGG=' + str(work) + '\n')
      - name: Download only the selected qualification records
        env:
          GH_TOKEN: ${{ github.token }}
          X64_RUN: ${{ inputs.x64_run }}
          X64_ARTIFACT: ${{ inputs.x64_artifact }}
          ARM64_RUN: ${{ inputs.arm64_run }}
          ARM64_ARTIFACT: ${{ inputs.arm64_artifact }}
        run: |
          gh run download "$X64_RUN" --repo "$GITHUB_REPOSITORY" --name "$X64_ARTIFACT" --dir "$ATSPI_AGG/linux-x64"
          gh run download "$ARM64_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARM64_ARTIFACT" --dir "$ATSPI_AGG/linux-arm64"
      - name: Select exact bytes by independently supplied hashes
        shell: python {0}
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          cohort = json.loads(Path(os.environ['COHORT_FILE']).read_text())
          work = Path(os.environ['ATSPI_AGG'])
          selected = {}
          for rid, pins in cohort['rids'].items():
              selected[rid] = {}
              for field, extension, destination in [('packageSha256', '.nupkg', 'package'), ('receiptSha256', '.json', 'receipt')]:
                  matches = [path for path in (work / rid).rglob('*' + extension) if hashlib.sha256(path.read_bytes()).hexdigest() == pins[field]]
                  if len(matches) != 1:
                      raise ValueError('Expected exactly one pinned ' + rid + ' ' + destination)
                  selected[rid][destination] = str(matches[0])
          (work / 'input-map.json').write_text(json.dumps(selected, indent=2))
      - name: Validate every retained RID and assemble one standard SDK package
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
        run: |
          python3 -I -m unittest discover -s tests/atspi -p 'test_*.py'
          python3 -I providers/atspi/public_aggregate.py --cohort "$COHORT_FILE" --inputs "$ATSPI_AGG/input-map.json" --output "$ATSPI_AGG/feed" --work "$ATSPI_AGG/sdk-work"
      - name: Verify ordinary SDK selection for both aggregate RIDs without execution
        run: |
          package=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["ATSPI_AGG"])/"sdk-work/aggregate-receipt.json").read_text())["path"])')
          cd "$ATSPI_AGG"
          printf '%s\n' '{"sdk":{"version":"10.0.403","rollForward":"disable"}}' > global.json
          test "$(dotnet --version)" = '10.0.403'
          for rid in linux-x64 linux-arm64; do
            python3 -I "$GITHUB_WORKSPACE/tests/atspi/consumer.py" --package "$package" --rid "$rid" --layout-only --output "$ATSPI_AGG/sdk-$rid"
          done
      - name: Retain an exact release candidate for independent review
        env:
          COHORT_FILE: ${{ inputs.cohort_file }}
        run: |
          cp "$COHORT_FILE" "$ATSPI_AGG/selected-cohort.json"
          python3 -I providers/atspi/release_candidate.py --aggregate-receipt "$ATSPI_AGG/sdk-work/aggregate-receipt.json" --cohort "$ATSPI_AGG/selected-cohort.json" --x64-layout "$ATSPI_AGG/sdk-linux-x64/consumer-receipt.json" --arm64-layout "$ATSPI_AGG/sdk-linux-arm64/consumer-receipt.json" --output "$ATSPI_AGG/release-candidate.json"
      - name: Retain the aggregate and first failing command
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-atspi-aggregate-${{ github.sha }}
          path: |
            ${{ env.ATSPI_AGG }}/feed/*.nupkg
            ${{ env.ATSPI_AGG }}/input-map.json
            ${{ env.ATSPI_AGG }}/selected-cohort.json
            ${{ env.ATSPI_AGG }}/release-candidate.json
            ${{ env.ATSPI_AGG }}/sdk-linux-*/consumer-receipt.json
            ${{ env.ATSPI_AGG }}/sdk-work/aggregate-receipt.json
            ${{ env.ATSPI_AGG }}/sdk-work/*.log
            ${{ env.ATSPI_AGG }}/sdk-work/*-command.json
          if-no-files-found: warn
          retention-days: 7
