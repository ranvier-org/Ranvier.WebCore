name: immutable preview12 Slim helper completion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  complete:
    if: ${{ false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 20
    concurrency:
      group: immutable-d31-mac-slim
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out immutable product F
        uses: actions/checkout@v4
        with:
          ref: d31c3631ed4bbe6520f7f5f7c7e7d34499c38122
          persist-credentials: false

      - name: Acquire external completion controller H
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/immutable-d31-helper-completion-controller"
          test ! -e "$control"
          git init "$control"
          git -C "$control" remote add origin https://github.com/ranvier-org/Ranvier.WebCore.git
          git -C "$control" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$control" checkout --detach FETCH_HEAD
          test "$(git -C "$control" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CONTROL_ROOT=$control" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/immutable-d31-slim-helper-completion" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Complete only missing AppKit helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B -I "$CONTROL_ROOT/scripts/complete_mac_slim_helpers.py"
          --producer-root "$GITHUB_WORKSPACE" --output "$EVIDENCE"

      - name: Retain original and stitched helper proof
        if: ${{ always() && env.EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: immutable-d31-mac-slim-helper-completion
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
