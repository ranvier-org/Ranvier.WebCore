name: Preview12 immutable Linux GPU qualification

on:
  push:
    branches: [codex/project2-preview12-linux-gpu-recovery]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [off, qualify]
        default: off

permissions:
  contents: read
  actions: read

concurrency:
  group: preview12-linux-gpu-qualification
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.policy.outputs.armed }}
      controller: ${{ steps.policy.outputs.controller }}
      tests: ${{ steps.policy.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: policy
        run: |
          python3 - <<'PY'
          import json, os, re
          data = json.load(open('docs/preview12-linux-gpu-recovery.json'))
          armed = data.get('armed') is True and os.environ['PHASE'] == 'qualify'
          controller, tests = (data['controllerSource'], data['testSource']) if armed else ('', '')
          if armed and not all(re.fullmatch('[0-9a-f]{40}', value or '') for value in [controller, tests]):
              raise ValueError('Require exact reviewed controller and corrected consumer sources')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'armed={str(armed).lower()}\ncontroller={controller}\ntests={tests}\n')
          PY
        env:
          PHASE: ${{ inputs.phase || 'off' }}
  qualify:
    needs: admission
    if: needs.admission.outputs.armed == 'true'
    name: qualify-${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: policy-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.controller }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.tests }}
          path: corrected-tests
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Install original Linux consumer dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          grep -v '^#' corrected-tests/scripts/linux-packages.txt | xargs sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends
          python3 -m pip install numpy==2.4.3
      - name: Fetch and prepare the original pinned upstream test inputs
        working-directory: corrected-tests
        env:
          RANVIER_WORK: ${{ runner.temp }}/preview12-fixtures
        run: |
          python3 -B -I scripts/build.py fetch --flavor gpu --rid ${{ matrix.rid }}
          python3 -B -I scripts/build.py prepare --flavor gpu --rid ${{ matrix.rid }}
      - name: Qualify original producer package and complete ABI catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B -I controller/scripts/recover_preview12_linux_gpu.py qualify
          --policy policy-source/docs/preview12-linux-gpu-recovery.json
          --test-source corrected-tests --rid ${{ matrix.rid }}
          --webkit-source "${{ runner.temp }}/preview12-fixtures/src"
          --output "${{ runner.temp }}/preview12-linux-qualified"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-preview12-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/preview12-linux-qualified/*.json
            ${{ runner.temp }}/preview12-linux-qualified/*.log
            ${{ runner.temp }}/preview12-linux-qualified/abi-evidence/**/*.json
            ${{ runner.temp }}/preview12-linux-qualified/abi-evidence/**/*.log
          if-no-files-found: warn
          retention-days: 14
