<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" id="root">
<defs><path id="motionPath" d="M20 30H120"/></defs>
<rect id="motionTarget" width="10" height="10" fill="red"><animateMotion id="motion" dur="2s" begin="indefinite" fill="freeze"><mpath id="motionReference" href="#motionPath"/></animateMotion></rect>
<rect id="transformTarget" x="200" y="0" width="10" height="10" fill="red"><animateTransform id="transform" attributeName="transform" type="rotate" from="0" to="90" dur="2s" begin="indefinite" fill="freeze"/></rect>
<rect id="setTarget" x="300" y="100" width="10" height="10" fill="red"><set id="set" attributeName="x" to="350" dur="2s" begin="indefinite" fill="freeze"/></rect>
</svg>
