<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" id="root">
<defs>
<linearGradient id="linear" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0"><stop id="start" offset="0" stop-color="red"/><stop id="end" offset="1" stop-color="blue"/></linearGradient>
<linearGradient id="inherited" href="#linear"/>
<radialGradient id="radial" gradientUnits="userSpaceOnUse" cx="200" cy="50" r="50" fx="200" fy="50" fr="0"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></radialGradient>
<pattern id="pattern" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse" x="0" y="120" width="10" height="10"><rect width="5" height="10" fill="red"/><rect x="5" width="5" height="10" fill="blue"/></pattern>
</defs>
<rect id="linearPaint" width="100" height="100" fill="url(#linear)"/>
<rect id="inheritedPaint" x="300" width="100" height="100" fill="url(#inherited)"/>
<rect id="radialPaint" x="150" width="100" height="100" fill="url(#radial)"/>
<rect id="patternPaint" y="120" width="100" height="50" fill="url(#pattern)"/>
</svg>
