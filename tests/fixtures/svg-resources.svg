<switch id="switch"><rect id="langRect" systemLanguage="xx" x="150" y="0" width="20" height="20" fill="red"/><rect id="fallback" x="150" y="0" width="20" height="20" fill="lime"/></switch>
<foreignObject id="foreign" x="200" y="0" width="40" height="40"><div xmlns="http://www.w3.org/1999/xhtml" id="html" style="width:40px;height:20px;background:blue"></div></foreignObject>
<a id="link" href="https://fixture.test/next" target="_blank" hreflang="en" rel="noopener next" type="text/html"><rect x="250" y="0" width="20" height="20" fill="lime"/></a>
<image id="image" href="https://fixture.test/blue.png" x="0" y="100" width="40" height="20" preserveAspectRatio="none"/>
<script id="script" type="text/ecmascript">document.documentElement.setAttribute('data-ran','yes')</script>
</svg>
