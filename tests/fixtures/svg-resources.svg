<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" id="root">
<title id="title">Resources</title>
<desc id="desc">S11 reuse, content and resource fixture</desc>
<metadata id="metadata"><item xmlns="urn:ranvier:fixture">m</item></metadata>
<style id="style" type="text/css" media="all" title="paint">#styled{fill:blue}</style>
<defs id="defs">
<symbol id="symbol" viewBox="0 0 10 10" preserveAspectRatio="none"><rect width="10" height="10" fill="red"/></symbol>
<rect id="green" width="20" height="20" fill="lime"/>
<rect id="blueTarget" width="20" height="20" fill="blue"/>
</defs>
<use id="useSymbol" href="#symbol" x="0" y="0" width="40" height="40"/>
<use id="useRect" href="#green" x="50" y="0"/>
